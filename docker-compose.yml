version: "3.8"

services:
  # Spark Master Node
  spark-master:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    container_name: vectorscale-spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--ip", "spark-master", "--port", "7077", "--webui-port", "8080"]
    networks:
      - vectorscale-net

  # Spark Worker Node 1
  spark-worker-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    container_name: vectorscale-spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=4G
    ports:
      - "8081:8081"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--webui-port", "8081", "spark://spark-master:7077"]
    networks:
      - vectorscale-net

  # Spark Worker Node 2
  spark-worker-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark
    container_name: vectorscale-spark-worker-2
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=4G
    ports:
      - "8082:8082"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--webui-port", "8082", "spark://spark-master:7077"]
    networks:
      - vectorscale-net

  # MinIO S3 Object Storage
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: vectorscale-minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio-storage:/data
    networks:
      - vectorscale-net

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: vectorscale-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - vectorscale-net

  # VectorScale Streamlit Operations Dashboard
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: vectorscale-dashboard
    depends_on:
      - spark-master
      - minio
      - qdrant
    ports:
      - "8501:8501"
    environment:
      - VECTOR_SCALE_SPARK__MASTER=spark://spark-master:7077
      - VECTOR_SCALE_STORAGE__MINIO_ENDPOINT=minio:9000
      - VECTOR_SCALE_STORAGE__QDRANT_URL=http://qdrant:6333
    networks:
      - vectorscale-net

networks:
  vectorscale-net:
    driver: bridge

volumes:
  minio-storage:
  qdrant-storage:
