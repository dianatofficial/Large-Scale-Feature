name: CI / Quality & Testing Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Flake8
        run: |
          flake8 src tests scripts config --count --max-line-length=120 --statistics --extend-ignore=E203,W503

      - name: Code Formatting Check (Black & isort)
        run: |
          black --check --line-length=120 src tests scripts config
          isort --check-only --profile=black src tests scripts config

      - name: Type Checking (Mypy)
        run: |
          mypy src --ignore-missing-imports

      - name: Execute Test Suite (Pytest)
        run: |
          pytest tests/unit/ -v --durations=10
